{% extends "/html/base.html" %}
{% block subtitle %}: Shows by {{name}}{% endblock %}
{% block content %}
<div id="posts-by-tag">
    <div id="page-header">
        <h2>Shows by {{name}}</h2>
    </div>
    <ul>
    {% for post in posts %}
        <li>
            {{post.date|date:"MMM, yyyy dd"}}{% if post.end %}-{{post.end}}{% endif %} - <a href="{{post.uri}}">{{post.title}}</a>
        </li>
    {% endfor %}
    </ul>
</div>
{% endblock %}
