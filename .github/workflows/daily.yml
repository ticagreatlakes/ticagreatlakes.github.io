name: Daily Script

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: 'source'
      - name: Checkout public (main)
        uses: actions/checkout@v7
        with:
          path: 'public'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74
        with:
          cli: '1.12.6.1673'
      - name: Cache All The Things
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
            ~/.deps.clj
          key: ${{ runner.os }}-${{ hashFiles('**/deps.edn') }}
      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Run script
        run: ./build.sh
